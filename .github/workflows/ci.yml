name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Self-test with no dependencies at all
        run: python agentrosetta.py --test

      - name: Demos run clean
        run: python agentrosetta.py --demo

      - name: Install test extras
        run: python -m pip install --upgrade pip pytest tiktoken

      - name: pytest
        run: pytest -q

      - name: Fidelity - round trip, recovery, cost split
        run: python bench/fidelity.py

      - name: Token comparison (informational)
        run: python bench/token_compare.py
